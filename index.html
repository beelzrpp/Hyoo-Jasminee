<style>
:root{
  --bg:#10143C; --ink:#EAF1FF; --btn:#FF8FC0; --btn-ink:#2A1224; --ghost:#A9BCFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark; --bg:#0A0D2A; --ink:#EAF1FF; --btn:#FF8FC0; --btn-ink:#2A1224; --ghost:#A9BCFF}
}
:root[data-theme="dark"]{color-scheme:dark; --bg:#0A0D2A; --ink:#EAF1FF; --btn:#FF8FC0; --btn-ink:#2A1224; --ghost:#A9BCFF}
html{background:var(--bg)}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex; justify-content:center; align-items:center; padding:.75rem;
  touch-action:manipulation; -webkit-user-select:none; user-select:none}
main{text-align:center}
canvas{display:block; margin:0 auto; image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer}
.row{display:flex; gap:.6rem; justify-content:center; margin-top:.8rem}
button{font:600 1rem/1 system-ui,sans-serif; border-radius:999px; padding:.8rem 1.4rem; cursor:pointer; border:2px solid var(--btn);
  background:var(--btn); color:var(--btn-ink)}
button.ghost{background:transparent; color:var(--ghost); border-color:var(--ghost)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>

  for (var k = 0; k < b[2]; k++) {
    var off = sway ? Math.round(Math.sin(t * 1.5 + b[0] * 0.2) * k * 0.12) : 0;
    px(b[0] + off, b[1] - k, 1, 1, css(k === b[2] - 1 ? [140, 210, 100] : b[3]));
  }
}

// ---------- permainan ----------
var alive = [], left = [], count = 0, over = false, parts = [], hearts = [], result = null;
function reset() {
  alive = []; left = [];
  for (var i = 0; i < N; i++) { alive.push(true); left.push(i); }
  count = 0; over = false; parts = []; hearts = []; result = null;
  var sg = $("song"); sg.pause(); sg.currentTime = 0;
  $("pluck").textContent = "Cabut kelopak"; $("live").textContent = "";
}
function burst(x, y, n) {
  for (var k = 0; k < n; k++) hearts.push({ x: x + Math.random() * 24 - 12, y: y + Math.random() * 10 - 5, life: 1.4 + Math.random() * 0.6, col: LOVES });
}
var sway = 0;
function pluck() {
  if (over) { reset(); return; }
  var k = Math.floor(Math.random() * left.length), i = left.splice(k, 1)[0];
  alive[i] = false;
  var loves = ((N - 1 - count) % 2 === 0); count++;
  var a = i / N * 2 * Math.PI - Math.PI / 2, col = loves ? LOVES : NOT;
  parts.push({ x: CX + sway + Math.cos(a) * 25, y: CY + Math.sin(a) * 25, vx: Math.cos(a) * 45 + Math.random() * 20 - 10,
    vy: Math.sin(a) * 45 - 30, ang: a, spin: Math.random() * 8 - 4, life: reduce ? 0.4 : 2, col: col });
  result = { txt: loves ? YES : NO, col: col, age: 0 };
  $("live").textContent = result.txt;
  if (loves) burst(CX + sway, CY - 28, 2);
  if (!left.length) {
    over = true; $("pluck").textContent = "Main lagi";
    if (loves) burst(CX + sway, CY - 30, 10);
    var sg = $("song"); sg.currentTime = 0;
    var pr = sg.play(); if (pr && pr.catch) pr.catch(function () {});
  }
}

function frame(t, dt) {
  sway = reduce ? 0 : Math.round(1.3 * Math.sin(t * 1.1));
  g.drawImage(bg, 0, 0);
  // bintang
  STARS.forEach(function (s) {
    var b = reduce ? 0.3 : Math.sin(t * 2 + s[2]);
    if (b > 0.6) { px(s[0], s[1], 1, 1, "#fff"); px(s[0] - 1, s[1], 1, 1, "#c8c8ff"); px(s[0] + 1, s[1], 1, 1, "#c8c8ff"); px(s[0], s[1] - 1, 1, 1, "#c8c8ff"); px(s[0], s[1] + 1, 1, 1, "#c8c8ff"); }
    else if (b > -0.2) px(s[0], s[1], 1, 1, "#c8c8ff");
    else px(s[0], s[1], 1, 1, "#6e6eaa");
  });
  GRASS.forEach(function (b) { if (b[1] < 220) blade(b, t, !reduce); });
  // batang
  for (var y = STEM_BOTTOM_Y; y >= CY + 8; y--) {
    var x = Math.round(stemX(y, sway));
    px(x - 1, y, 2, 1, "rgb(60,150,60)"); px(x - 1, y, 1, 1, "rgb(90,180,70)");
  }
  ell(stemX(170, sway) - 9, 170, 10, 4, Math.PI + 0.45, "rgb(50,140,60)", "rgb(35,105,50)");
  ell(stemX(188, sway) + 9, 188, 10, 4, -0.45, "rgb(50,140,60)", "rgb(35,105,50)");
  // kelopak
  var hx = CX + sway;
  for (var i = 0; i < N; i++) {
    if (!alive[i]) continue;
    var a = i / N * 2 * Math.PI - Math.PI / 2 + (reduce ? 0 : 0.03 * Math.sin(t * 1.3 + i));
    ell(hx + Math.cos(a) * 25, CY + Math.sin(a) * 25, 16, 7, a, css([255, 248, 236]), css([226, 208, 232]));
  }
  // pusat bunga
  for (var yy = -11; yy <= 11; yy++) for (var xx = -11; xx <= 11; xx++) {
    var d = xx * xx + yy * yy;
    if (d <= 121) px(hx + xx, CY + yy, 1, 1, d > 90 ? "rgb(150,180,20)" : (((xx + yy) & 3) === 0 && d < 70 ? "rgb(150,180,20)" : css(IDLE)));
  }
  GRASS.forEach(function (b) { if (b[1] >= 220) blade(b, t, !reduce); });
  // kelopak terbang
  parts = parts.filter(function (p) {
    p.vy += 70 * dt; p.x += (p.vx + 8 * Math.sin(t * 3 + p.ang)) * dt; p.y += p.vy * dt; p.ang += p.spin * dt; p.life -= dt;
    if (p.life <= 0 || p.y > H + 20) return false;
    ell(p.x, p.y, 14, 6, p.ang, css(p.col), css([p.col[0] * 0.8, p.col[1] * 0.8, p.col[2] * 0.9].map(Math.round)), Math.min(1, p.life / 0.6));
    return true;
  });
  hearts = hearts.filter(function (h) {
    h.y -= 22 * dt; h.life -= dt;
    if (h.life <= 0) return false;
    heart(Math.round(h.x), Math.round(h.y), h.col, Math.min(1, h.life / 0.5)); return true;
  });
  // teks
  if (result) {
    result.age += dt;
    var pop = result.age < 0.25 ? 1 + (1 - result.age / 0.25) * 0.35 : 1;
    txt(result.txt, 90, 26, Math.round(14 * pop), result.col);
  } else txt("TAP / SPACE", 90, 26, 12, IDLE, 0.6 + 0.4 * Math.sin(t * 4));
  txt((N - count) + "/" + N, 18, 10, 8, IDLE, 0.8);
  if (over) txt("TAP = RESTART", 90, 42, 8, IDLE, 0.7 + 0.3 * Math.sin(t * 4));
}
var last = 0;
function loop(ts) {
  var t = ts / 1000, dt = Math.min(0.05, t - last); last = t;
  frame(t, dt); requestAnimationFrame(loop);
}
function fit() {
  var s = Math.max(1, Math.floor(Math.min((window.innerWidth - 24) / W, (window.innerHeight - 120) / H)));
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
}
cv.addEventListener("click", function () { pluck(); });
$("pluck").onclick = pluck; $("reset").onclick = reset;
document.addEventListener("keydown", function (e) {
  if (e.key === "r" || e.key === "R") reset();
  else if ((e.key === " " || e.key === "Enter") && !(document.activeElement && document.activeElement.tagName === "BUTTON")) { e.preventDefault(); pluck(); }
});
window.addEventListener("resize", fit);
reset(); fit(); requestAnimationFrame(loop);
</script>
</body>
